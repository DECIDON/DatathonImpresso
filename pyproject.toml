[project]
name = "impresso-chunks"
version = "0.1.0"
description = "Extraction des prises de parole (chunks) des débats parlementaires OCR + NER"
authors = [
    { name = "Bertrand Duménieu", email = "bertrand.dumenieu@ehess.fr" }
]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "loguru>=0.7.3",
    "rich>=15.0.0",
]

[project.scripts]
impresso-chunks = "impresso_chunks.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
