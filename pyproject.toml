[project]
name = "datathon-impresso"
version = "0.1.0"
description = "Expérimentations Impresso sur les débats parlementaires du JORF (OCR + NER)"
authors = [
    { name = "Bertrand Duménieu", email = "bertrand.dumenieu@ehess.fr" }
]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=2.2",
    "plotly>=7.1.0",
    "pydantic>=2.9",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[tool.uv.build-backend]
module-name = "debats"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
